{% extends 'base.html' %}

{% block title %}Delete Location{% endblock %}

{% block content %}
<h1>Delete Location</h1>
<p>Are you sure you want to delete "{{ location.name }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Delete</button>
    <a href="{% url 'location_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
