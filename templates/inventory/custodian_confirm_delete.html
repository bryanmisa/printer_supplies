{% extends 'base.html' %}

{% block title %}Delete Custodian{% endblock %}

{% block content %}
<h1>Delete Custodian</h1>
<p>Are you sure you want to delete "{{ custodian.full_name }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Delete</button>
    <a href="{% url 'custodian_list' %}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
