{% extends "base.html" %}
{% block title %}Consumption Report - Printer Supplies{% endblock %}
{% block page_title %}Consumption Report{% endblock %}

{% block content %}
<div class="card">
    <div class="card-header">
        <i class="bi bi-graph-up me-2"></i> Consumption Report
        <form method="get" class="filter-bar" style="margin-bottom:0;">
            <div class="filter-group">
                <select name="months" class="form-select no-select2">
                    <option value="3" {% if months == 3 %}selected{% endif %}>Last 3 Months</option>
                    <option value="6" {% if months == 6 %}selected{% endif %}>Last 6 Months</option>
                    <option value="12" {% if months == 12 %}selected{% endif %}>Last 12 Months</option>
                </select>
            </div>
            <div class="filter-group">
                <select name="custodian" class="form-select no-select2">
                    <option value="">All Custodians</option>
                    {% for user in custodians %}
                    <option value="{{ user.id }}">{{ user.first_name }} {{ user.last_name }}</option>
                    {% endfor %}
                </select>
            </div>
            <button type="submit" class="btn btn-primary">Filter</button>
        </form>
    </div>
    <div class="card-body">
        <div class="chart-container" style="height:300px;">
            <canvas id="consumptionReportChart"></canvas>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
Chart.defaults.color = '#64748b';
Chart.defaults.borderColor = 'rgba(255,255,255,0.05)';

const canvas = document.getElementById('consumptionReportChart');
if (canvas) {
    const labels = {{ chart_labels|safe }};
    const data = {{ chart_data|safe }};
    
    if (labels.length > 0 && data.some(d => d > 0)) {
        new Chart(canvas, {
            type: 'line',
            data: {
                labels: labels,
                datasets: [{
                    label: 'Supplies Consumed',
                    data: data,
                    borderColor: '#2563eb',
                    backgroundColor: 'rgba(37, 99, 235, 0.1)',
                    fill: true,
                    tension: 0.4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                    x: { grid: { color: 'rgba(255,255,255,0.04)' } },
                    y: {
                        beginAtZero: true,
                        ticks: { stepSize: 1 },
                        grid: { color: 'rgba(255,255,255,0.04)' }
                    }
                }
            }
        });
    } else {
        canvas.parentElement.innerHTML = '<div class="text-center text-muted py-5"><i class="bi bi-graph-up" style="font-size: 3rem;"></i><p class="mt-3">No consumption data available for this period</p></div>';
    }
}
</script>
{% endblock %}
